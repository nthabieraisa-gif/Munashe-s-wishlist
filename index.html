<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3ee"><title>Munashe's Baby Wishlist</title>
<style>
:root{--bg:#f8f4ef;--card:#fff;--ink:#29313a;--muted:#72777d;--accent:#7897a8;--line:#e8e0d7;--green:#5f8b70}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} a{color:inherit}
header{padding:28px 18px 20px;text-align:center;background:linear-gradient(180deg,#fff,#f8f4ef)}
h1{margin:0 0 8px;font-family:Georgia,serif;font-size:30px;font-weight:500} .sub{margin:0 auto;max-width:620px;color:var(--muted);font-size:14px;line-height:1.5}
.mobilebar{position:sticky;top:0;z-index:20;background:rgba(248,244,239,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 12px}
.bar{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none} .bar::-webkit-scrollbar{display:none}
.shop{position:relative;flex:0 0 auto} button,.buy{font:inherit} .shopbtn,.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;white-space:nowrap;font-weight:600;font-size:13px}
.filters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none} .filters::-webkit-scrollbar{display:none} .filter.active{background:var(--accent);color:white;border-color:var(--accent)}
.panel{display:none;position:absolute;left:0;top:48px;width:min(330px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 35px #0002;padding:8px}
.shop.open .panel{display:block} .shoplink{display:flex;justify-content:space-between;gap:10px;text-decoration:none;padding:13px 12px;border-radius:11px;font-size:14px} .shoplink:hover{background:#f5f1ec} .shoplink span{color:var(--accent);font-size:12px}
.container{max-width:1100px;margin:auto;padding:18px 14px 35px} .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #0000000b} .photo{aspect-ratio:1/1;background:#f1eee9;display:flex;align-items:center;justify-content:center} .photo img{width:100%;height:100%;object-fit:cover;display:block} .content{padding:13px} .cat{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)} h2{font-size:16px;line-height:1.25;margin:6px 0 8px} .meta{font-size:13px;color:var(--muted);line-height:1.5;min-height:38px} .actions{display:flex;gap:8px;margin-top:12px} .buy,.claim{flex:1;text-align:center;border-radius:10px;padding:10px 8px;font-size:12px;font-weight:700;text-decoration:none;border:1px solid var(--line);cursor:pointer} .buy{background:#7897a8;color:#fff;border-color:#7897a8} .claim{background:#fff;color:var(--ink)} .claim.checked{background:#e8f2eb;border-color:#bcd5c3;color:#477458} .badge{font-size:12px;color:var(--green);margin-top:7px;font-weight:600} footer{text-align:center;color:var(--muted);font-size:12px;padding:28px 0 5px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px} header{padding:42px 20px 28px} h1{font-size:38px}}
</style></head><body>

const grid=document.getElementById('grid'), filters=document.getElementById('filters'), panel=document.getElementById('panel'), shop=document.getElementById('shop');
let current='All';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const SUPABASE_URL='https://wgsuvbiwixwmsilexpc.supabase.co';
const SUPABASE_KEY='sb_publishable_iaQDN1wKniGisMdM6OvG6A_tqxUCOPb';
const CLAIMS_ENDPOINT=SUPABASE_URL+'/rest/v1/wishlist_claims';
function itemId(x){return x.item;}
async function loadClaims(){
  try{
    const r=await fetch(CLAIMS_ENDPOINT+'?select=item_id,claimed_by');
    if(!r.ok)throw new Error('Could not load claims');
    const claims=await r.json();
    const map=new Map(claims.map(c=>[c.item_id,c.claimed_by]));
    items.forEach(x=>{x.claimedBy=map.get(itemId(x))||'';x.claimed=!!x.claimedBy});
  }catch(e){
    console.error(e);
    alert('We could not load the latest claimed items. Please refresh the page.');
  }
}
async function claimItem(i){
  const x=items[i];
  if(x.claimedBy){
    alert('This item has already been claimed by '+x.claimedBy+'.');
    return;
  }
  const name=prompt('Please enter your name so everyone knows who has claimed this item:');
  if(name===null)return;
  const claimedBy=name.trim();
  if(!claimedBy){alert('Please enter your name.');return;}
  const r=await fetch(CLAIMS_ENDPOINT,{
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({item_id:itemId(x),item_name:x.item,claimed_by:claimedBy})
  });
  if(r.ok){x.claimedBy=claimedBy;x.claimed=true;render();return;}
  if(r.status===409){
    await loadClaims();
    const current=items[i].claimedBy;
    alert(current?'This item was just claimed by '+current+'.':'This item was just claimed by someone else.');
    render();
    return;
  }
  const msg=await r.text().catch(()=> '');
  console.error('Claim failed',r.status,msg);
  alert('Sorry, the claim could not be saved. Please try again.');
}
function renderMenu(){panel.innerHTML=items.filter(x=>x.link).map(x=>`<a class="shoplink" href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.item)}<span>Taobao ↗</span></a>`).join('')}
function renderFilters(){const cats=['All',...new Set(items.map(x=>x.category).filter(Boolean))];filters.innerHTML=cats.map(c=>`<button class="filter ${c===current?'active':''}" type="button" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
function render(){const visible=current==='All'?items:items.filter(x=>x.category===current);grid.innerHTML=visible.map((x)=>{const i=items.indexOf(x);return `<article class="card"><div class="photo">${x.image?`<img src="${x.image}" alt="${esc(x.item)}">`:'<span>Photo coming soon</span>'}</div><div class="content"><div class="cat">${esc(x.category||'Baby')}</div><h2>${esc(x.item)}</h2><div class="meta">${x.colour?`Colour: ${esc(x.colour)}<br>`:''}${x.price?`Price: ${esc(x.price)}`:''}</div>${x.claimed?`<div class="badge">✓ Claimed by ${esc(x.claimedBy)}</div>`:''}<div class="actions">${x.link?`<a class="buy" href="${esc(x.link)}" target="_blank" rel="noopener">🛒 Taobao</a>`:''}<button class="claim ${x.claimed?'checked':''}" type="button" data-index="${i}">${x.claimed?'✓ Claimed':'Claim'}</button></div></div></article>`}).join('')}
shopbtn.addEventListener('click',()=>shop.classList.toggle('open'));document.addEventListener('click',e=>{if(!shop.contains(e.target))shop.classList.remove('open')});
filters.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;current=b.dataset.cat;renderFilters();render();window.scrollTo({top:0,behavior:'smooth'})});
grid.addEventListener('click',async e=>{const b=e.target.closest('[data-index]');if(!b)return;const i=Number(b.dataset.index);await claimItem(i)});
(async()=>{await loadClaims();renderMenu();renderFilters();render()})();
</script></body></html>
